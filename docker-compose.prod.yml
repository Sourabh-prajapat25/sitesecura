version: '3.8'

# ==============================================================================
# SITESECURA PRODUCTION DOCKER COMPOSE CONFIGURATION
# Production Deployment Architecture:
# - Only Nginx exposes ports 80 and 443 to the host network
# - All internal services (postgres, redis, api, web, worker, beat) are private
# - Persistent volumes for postgres, redis, and report storage
# - Strict health checks and automatic restart policies
# - Log rotation configured to prevent disk exhaustion
# ==============================================================================

networks:
  scanly_prod_net:
    driver: bridge
    internal: false

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_reports:
    driver: local
  nginx_ssl:
    driver: local
  certbot_www:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database (Private - No public host ports)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: scanly-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-scanly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scanly_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scanly}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 2. Redis In-Memory Store & Task Broker (Private - No public host ports)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: scanly-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "900", "1", "--save", "300", "10"]
    volumes:
      - redis_data:/data
    networks:
      - scanly_prod_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 3. FastAPI Application Backend (Private - No public host ports)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: scanly-prod-api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scanly}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scanly}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      STORAGE_PATH: /storage/reports
    volumes:
      - storage_reports:/storage/reports
    networks:
      - scanly_prod_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 4. Celery Worker (Executes Scans, Reports & Background Tasks)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    container_name: scanly-prod-worker
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scanly}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scanly}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      STORAGE_PATH: /storage/reports
    volumes:
      - storage_reports:/storage/reports
    networks:
      - scanly_prod_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 5. Celery Beat Scheduler (Single Active Instance - Stale Scans & Monitoring)
  # ----------------------------------------------------------------------------
  beat:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    container_name: scanly-prod-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scanly}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    networks:
      - scanly_prod_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 6. Next.js Web Frontend (Private - No public host ports)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://sitesecura.com}
    container_name: scanly-prod-web
    restart: unless-stopped
    networks:
      - scanly_prod_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 7. Nginx Reverse Proxy (ONLY Public Gateway: Ports 80 & 443)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: scanly-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl
      - certbot_www:/var/www/certbot:ro
    networks:
      - scanly_prod_net
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
